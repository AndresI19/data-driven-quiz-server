# CI/CD & release engineering — the pipeline half of the platform.
# Born from building platform-cicd: triggers, races, image identity, and pipeline security.
section:
  key: L
  name: CI/CD & Release Engineering
  color: "#7c3aed"

cards:
  - labels: [operations]
    topic: "Pipeline security scans (shift-left)"
    desc: "Run automated security checks on every pull request, before merge, so problems are caught in review rather than in production. Three complementary kinds cover different attack surfaces."
    extras:
      - label: SAST
        text: "Static Application Security Testing (e.g. CodeQL) — analyses your source for vulnerability patterns: injection, clear-text secrets, unsafe deserialisation."
      - label: Secret scanning
        text: "e.g. gitleaks — greps the diff (and history) for committed API keys, tokens, and private keys before they reach the remote."
      - label: Dependency scanning
        text: "audits third-party packages for known CVEs (Common Vulnerabilities and Exposures)."
    match:
      - ["SAST (CodeQL)", "scans YOUR source for vulnerability patterns"]
      - ["secret scanning (gitleaks)", "catches committed keys/tokens in the diff"]
      - ["dependency scan", "flags known CVEs in third-party packages"]

  - labels: [operations]
    topic: "The GITHUB_TOKEN recursion guard"
    desc: "A workflow authenticated with the default GITHUB_TOKEN cannot trigger ANOTHER workflow. So if a CI job pushes a git tag, an `on: push: tags` workflow will NOT fire — the tag appears and nothing happens, with no error. It's a deliberate guard against infinite workflow loops."
    extras:
      - label: Work-arounds
        text: "Either do both steps in ONE workflow chained by `needs:`, or ride the SAME triggering event twice (two workflows both on `push: main`), or dispatch explicitly with a separate fine-grained token."
      - label: Trap
        text: "The failure is SILENT — the tag is created, but the build that should follow never starts. Nothing tells you."
    inverse: true
    cloze:
      text: "A workflow authenticated with the default GITHUB_TOKEN cannot {} another workflow — a guard against infinite CI loops."
      answer: "trigger"
    multi:
      - "chain both steps in one workflow via needs:"
      - "ride the same triggering event in two workflows"
      - "dispatch with a separate fine-grained token (PAT)"
    mcq:
      prompt: A CI job's pushed tag never starts the release workflow because the default credential can't trigger another run. Which credential, used for the push, works around this guard?
      options:
      - OIDC token
      - deploy key
      - GITHUB_TOKEN
      - PAT
      answerIndex: 3

  - labels: [operations]
    topic: "repository_dispatch"
    desc: "A GitHub Actions event that lets one repository (or an external system) trigger a workflow in ANOTHER repo via an authenticated API POST. Used for cross-repo pipelines — e.g. an app repo tells a central deploy repo 'build and ship version X'."
    extras:
      - label: Why
        text: "GITHUB_TOKEN is scoped to its own repo and can't dispatch elsewhere, so cross-repo triggering needs a dedicated fine-grained token, scoped to only the target repo."
      - label: Say
        text: "\"repository_dispatch is how you fan a deploy out to a repo that owns the runner, keeping build and deploy privileges separate.\""
    cloze:
      text: "To trigger a workflow in a DIFFERENT repository, POST a {} event with a token scoped to the target repo."
      answer: "repository_dispatch"
    mcq:
      prompt: An external system needs to kick off a workflow in another repo through an authenticated API POST. Which event does it send?
      options:
      - workflow_dispatch
      - workflow_call
      - repository_dispatch
      - deployment
      answerIndex: 2

  - labels: [operations]
    topic: "The 'read the value, don't recompute it' race"
    desc: "When two independent jobs each compute 'latest + 1' for the same commit, they RACE and disagree — one sees the other's new value and lands one higher. The fix: one job is the source of truth (it creates the value); everyone else READS what it created, never recomputes it."
    cloze:
      text: "When two jobs each compute 'latest + 1' they race and disagree; the fix is to make one job the single {} of truth that everyone else reads from, never recomputes."
      answer: "source"
    extras:
      - label: "e.g."
        text: "A release job that recomputed the next version got 0.1.14 while the tagger cut 0.1.13, then waited forever for a tag that would never exist. It should have waited for, and read, the tag on the commit."
      - label: Principle
        text: "Idempotency + single source of truth. Two computations of 'the next number' cannot be made to agree; only reading the one that exists can."

  - labels: [operations]
    topic: "Mutable :latest + IfNotPresent = a silent no-op deploy"
    desc: "With a mutable tag like `:latest` and `imagePullPolicy: IfNotPresent`, the kubelet sees the tag already present on the node and never pulls the new image. Every step — build, load, rollout — reports success, and the cluster keeps running the OLD code."
    extras:
      - label: Fix
        text: "Use CONTENT-ADDRESSED tags (the git SHA, or a hash of the build) so a new build is a NEW tag. The Pod spec then changes, and `kubectl apply` performs a real rolling update — no forced restart needed."
      - label: Trap
        text: "`:latest` is a POINTER, not an identity — nothing downstream can tell two builds apart, so caches and pull-policies all short-circuit."
    cloze:
      text: "To make every build deployable, tag images by {} (the commit SHA) rather than a mutable pointer like :latest."
      answer: "content"
      alts:
        - content address
        - the commit sha

  - labels: [operations]
    topic: "Concurrency groups (and dropped runs)"
    desc: "A `concurrency:` group serialises or cancels overlapping workflow runs that share a key — e.g. only one deploy to an environment at a time. The side effect: a run can be CANCELLED or dropped when a newer one supersedes it, so a merge's deploy may silently not happen."
    cloze:
      text: "A {} group serialises or cancels overlapping workflow runs that share a key, so a newer run can drop an in-flight one."
      answer: "concurrency"
    extras:
      - label: Recovery
        text: "Re-trigger by pushing again — even an empty commit re-fires the `push` event and the deploy runs."
      - label: Why it exists
        text: "Two deploys racing to the same environment can interleave and leave it in a mixed state; the group forces order."
    mcq:
      prompt: You want only one deploy to production at a time, and a newer run should cancel any in-flight one. Which workflow keyword enforces that?
      options:
      - needs
      - matrix
      - environment
      - concurrency
      answerIndex: 3

  - labels: [operations]
    topic: "Self-hosted runner scoping"
    desc: "A self-hosted CI runner executes jobs on YOUR hardware. On a personal account a runner is registered to ONE repository, so no other repo — including a stranger's fork opening a PR — can reach it. Its labels (e.g. self-hosted) decide which jobs it accepts."
    cloze:
      text: "A self-hosted runner registered to a single repository means a stranger's {} opening a PR cannot reach your hardware."
      answer: "fork"
    extras:
      - label: Risk
        text: "A runner that untrusted code can reach is a foothold on your machine. Scope it tightly; never let fork PRs run privileged jobs on it."
      - label: Contrast
        text: "GitHub-HOSTED runners are fresh per job and destroyed after — a fork's PR gets no secrets and no persistence."

  - labels: [operations]
    topic: "Branch protection & required status checks"
    desc: "Rules on a protected branch (main) that block direct pushes and require a pull request whose CI checks are GREEN — and often an approving review — before merge. It makes 'tests pass' a precondition of landing code, not an afterthought."
    cloze:
      text: "A protected branch blocks direct pushes and requires a pull request whose CI checks are green — and often an approving {} — before merge."
      answer: "review"
    extras:
      - label: Admin merge
        text: "A repo admin can override (merge despite an unmet REVIEW requirement) with `gh pr merge --admin` — used for solo projects, but it should never bypass FAILING CI, only a missing human reviewer."
      - label: Say
        text: "\"Required checks turn the pipeline into a gate: main only ever contains code that passed.\""

  - labels: [operations]
    topic: "Deploy on merge: version-tag then release"
    desc: "A common continuous-deployment shape: merging to main fires TWO workflows on the same push event. One (version-tag) cuts the release tag; the other (release) reads that tag and dispatches the actual build-and-deploy to a runner. Merge → tag → deploy, with no manual step."
    cloze:
      text: On merge to main, one workflow cuts the release {} and a second reads it to dispatch the build-and-deploy — no manual step.
      answer: "tag"
    order:
      - "Merge the PR to main (a single push event)"
      - "The version-tag workflow fires and cuts the release tag"
      - "The release workflow fires on the same event and reads that tag"
      - "It dispatches the build-and-deploy to the runner"
    extras:
      - label: Why two workflows
        text: "The recursion guard means the tag can't trigger the deploy, so both ride the push:main event; release WAITS for the tag to land, then reads it — it doesn't recompute the version."
      - label: The version IS the image identity
        text: "The version is baked into the image (a VERSION file) and is half the image tag, so cutting a tag actually changes what gets built and shipped."

  - labels: [operations]
    topic: "Rolling update vs blue-green vs canary"
    desc: "Strategies for shipping a new version with minimal disruption."
    extras:
      - label: Rolling
        text: "Replace pods a few at a time; the default in Kubernetes. Cheap, but old and new run together briefly."
      - label: Blue-green
        text: "Stand up the new version fully (green) beside the old (blue), then switch traffic at once; instant rollback by switching back."
      - label: Canary
        text: "Route a small slice of traffic to the new version, watch metrics, then ramp up or roll back."
    match:
      - ["rolling", "swap pods a few at a time — old and new overlap briefly"]
      - ["blue-green", "full new stack beside the old, flip traffic at once"]
      - ["canary", "a small traffic slice first, ramp on good metrics"]
  - labels: [operations]
    topic: SAST (static source scanning)
    desc: SAST statically analyzes your own source code for vulnerability patterns like injection and unsafe deserialization, before the app ever runs.
    cloze:
      text: '{} statically analyzes your own source code for vulnerability patterns like injection and unsafe deserialization, before the app ever runs.'
      answer: SAST
    mcq:
      prompt: A CI check parses your own source (not a running app, not third-party packages) for injection-style vulnerabilities. Which scan type is it?
      options:
      - DAST
      - SCA
      - SAST
      - IAST
      answerIndex: 2
  - labels: [operations]
    topic: Content-addressed image tags
    desc: Because :latest is a mutable pointer that IfNotPresent won't re-pull, give every build a content-addressed tag — like the commit SHA — so each is a distinct, immutable identity.
    cloze:
      text: Because :latest is a mutable pointer that IfNotPresent won't re-pull, give every build a {} tag — like the commit SHA — so each is a distinct, immutable identity.
      answer: content-addressed
    mcq:
      prompt: Every step reports success but the cluster still runs old code, because :latest with IfNotPresent never re-pulls. Which image-tagging scheme fixes this for good?
      options:
      - Semantic-version tags
      - Rolling :latest
      - Content-addressed tags
      - :stable aliases
      answerIndex: 2
  - labels: [operations]
    topic: Required review (branch protection)
    desc: A protected branch blocks direct pushes to main and can require, before merge, a passing pipeline plus an approving review from another person.
    cloze:
      text: A protected branch blocks direct pushes to main and can require, before merge, a passing pipeline plus an approving {} from another person.
      answer: review
    mcq:
      prompt: Which branch-protection rule specifically requires a human to approve a pull request before it can merge, as opposed to an automated gate?
      options:
      - Required status checks
      - Linear history
      - Required review
      - Signed commits
      answerIndex: 2
  - labels: [operations]
    topic: Deployment strategies (canary / blue-green)
    desc: Routing a small slice of traffic to the new version, watching its metrics, then ramping up is a canary deployment.
    cloze:
      text: Routing a small slice of traffic to the new version, watching its metrics, then ramping up is a {} deployment.
      answer: canary
    mcq:
      prompt: You stand up the new version fully beside the old, flip all traffic at once, and can roll back instantly by flipping back. Which strategy is this?
      options:
      - rolling
      - canary
      - blue-green
      - recreate
      answerIndex: 2
  - labels: [operations]
    topic: Flaky tests erode trust
    desc: A test that passes and fails on identical code trains developers to re-run until green, hiding real regressions; such a test is flaky.
    cloze:
      text: A test that passes and fails on identical code trains developers to re-run until green, hiding real regressions; such a test is {}.
      answer: flaky
    mcq:
      prompt: Your CI's red builds are so often 'just re-run it' that a genuine breakage merged unnoticed. Which CI reliability problem most directly caused that eroded trust?
      options:
      - Flaky tests
      - Low coverage
      - Slow builds
      - Missing fixtures
      answerIndex: 0
  - labels: [operations]
    topic: Masking secrets in CI logs
    desc: A pipeline that echoes an environment variable can print an API key into readable build logs unless the runner treats the value as a masked secret.
    cloze:
      text: A pipeline that echoes an environment variable can print an API key into readable build logs unless the runner treats the value as a {} secret.
      answer: masked
    mcq:
      prompt: A contributor's build printed the deploy token in plain text because it was passed as an ordinary variable. Which handling would have redacted it from the log output?
      options:
      - Marking it a masked secret
      - Base64-encoding it
      - Putting it in a comment
      - Using a longer value
      answerIndex: 0
  - labels: [operations]
    topic: Rollback vs roll-forward
    desc: When a release breaks production, reverting to the last known-good version immediately, rather than debugging live, is a rollback.
    cloze:
      text: When a release breaks production, reverting to the last known-good version immediately, rather than debugging live, is a {}.
      answer: rollback
    mcq:
      prompt: A deploy causes errors, the cause is unclear, and your reliability target is bleeding by the minute. Which action restores service fastest, deferring the diagnosis?
      options:
      - Roll back the release
      - Roll forward a fix
      - Add more logging
      - Scale up replicas
      answerIndex: 0
  - labels: [operations]
    topic: Build once, deploy everywhere
    desc: Rebuilding a separate image per environment risks staging and prod differing; the safer pipeline builds one artifact and promotes it through environments.
    cloze:
      text: Rebuilding a separate image per environment risks staging and prod differing; the safer pipeline builds one artifact and {} it through environments.
      answer: promotes
    mcq:
      prompt: A bug appeared only in production because prod's image was rebuilt from source separately from the one tested in staging. Which principle prevents that divergence?
      options:
      - Build once, deploy everywhere
      - Rebuild per environment
      - Pin to the latest tag
      - Compile on the node
      answerIndex: 0
  - labels: [operations]
    topic: 'GitOps: pull-based delivery'
    desc: Unlike a CI job that pushes kubectl apply, GitOps runs an in-cluster agent that pulls the desired state from Git and reconciles the live cluster to it.
    cloze:
      text: Unlike a CI job that pushes kubectl apply, GitOps runs an in-cluster agent that {} the desired state from Git and reconciles the live cluster to it.
      answer: pulls
    mcq:
      prompt: Your cluster drifted because someone ran kubectl edit by hand, and on the next sync it reverted itself. Which delivery model, with an agent like Argo CD continuously reconciling, produced that?
      options:
      - GitOps
      - Push-based CI/CD
      - Blue-green
      - Immutable infra
      answerIndex: 0
  - labels: [operations]
    topic: Git as single source of truth
    desc: In a GitOps setup, the way to roll back a bad release is to revert the Git commit, after which the agent reconciles the cluster back automatically.
    cloze:
      text: In a GitOps setup, the way to roll back a bad release is to revert the {}, after which the agent reconciles the cluster back automatically.
      answer: Git commit
    mcq:
      prompt: A platform team wants every production change to be an auditable, reviewable, revertible pull request rather than an ad-hoc command. Which practice makes Git history the source of truth for cluster state?
      options:
      - GitOps
      - Ad-hoc kubectl
      - Manual Helm upgrades
      - SSH runbooks
      answerIndex: 0
  - labels: [operations]
    topic: Image signing / provenance
    desc: To stop a tampered or unknown container image from running, you cryptographically sign images at build and check them at the admission gate.
    cloze:
      text: To stop a tampered or unknown container image from running, you cryptographically {} images at build and check them at the admission gate.
      answer: sign
    mcq:
      prompt: A supply-chain review requires that only images built by your own pipeline can deploy, rejecting anything else at the cluster gate. Which control enforces that authenticity?
      options:
      - Signed images with cosign
      - A private registry
      - Image tag pinning
      - A vulnerability scan
      answerIndex: 0
  - labels: [operations]
    topic: SBOM / dependency provenance
    desc: A machine-readable inventory of every library and version inside a build — used to answer 'are we affected?' the day a CVE drops — is an SBOM.
    cloze:
      text: A machine-readable inventory of every library and version inside a build — used to answer 'are we affected?' the day a CVE drops — is an {}.
      answer: SBOM
    mcq:
      prompt: When Log4Shell broke, teams that could instantly list which builds contained the vulnerable library patched in hours. Which build artifact gives that instant dependency inventory?
      options:
      - A software bill of materials
      - A container image digest
      - A dependency lockfile
      - A CVE severity score
      answerIndex: 0
