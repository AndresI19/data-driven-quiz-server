section:
  key: F
  name: Observability
  color: "#8b5cf6"
cards:
  - labels: [operations]
    topic: "Three pillars: logs, metrics, traces"
    desc: The complementary signal types that together explain what a system is doing.
    extras:
      - label: e.g.
        text: metrics tell you the error rate spiked (what), logs show the stack trace (why), traces show which service in the chain caused it (where).
    cloze:
      text: Metrics tell you what broke and traces tell you where; {} tell you why.
      answer: logs
    fill:
      text: "{0} tell you the error rate spiked; {1} show the stack trace; {2} show which service in the chain caused it."
      blanks:
        - "metrics"
        - "logs"
        - "traces"
      distractors:
        - "events"
        - "alerts"
    hint: Three signal types that together explain what broke, why, and where.
    mcq:
      prompt: You know the error rate spiked and you have the stack trace, but you need to see which service in a multi-hop request chain caused the failure. Which signal shows the end-to-end path across services?
      options:
      - Metrics
      - Traces
      - Logs
      - Profiles
      answerIndex: 1
  - labels: [operations]
    topic: OpenTelemetry
    desc: The vendor-neutral standard for emitting traces, metrics, and logs.
    extras:
      - label: e.g.
        text: instrument your app once with the OpenTelemetry SDK (vendor-neutral tracing/metrics libraries); it exports traces to Jaeger (a distributed-tracing UI) and metrics to Prometheus (a time-series metrics database) — swap either backend without touching app code.
    cloze:
      text: "{} is the vendor-neutral standard for emitting traces, metrics, and logs."
      answer: OpenTelemetry
      alts:
        - otel
        - open telemetry
    hint: The vendor-neutral standard for emitting traces, metrics, and logs.
    mcq:
      prompt: OpenTelemetry is the vendor-neutral instrumentation standard. Which of these is a distributed-tracing backend and UI that it can export spans to?
      options:
      - Prometheus
      - Loki
      - StatsD
      - Jaeger
      answerIndex: 3
  - labels: [operations]
    topic: Prometheus & Grafana
    desc: "The de-facto open-source metrics stack in K8s: Prometheus COLLECTS + STORES the numbers, Grafana VISUALIZES them. They're two halves — one is the database, the other is the dashboard."
    extras:
      - label: Grafana
        text: a visualization + alerting layer that is DATA-SOURCE AGNOSTIC — it graphs Prometheus, but also Loki (logs), Tempo (traces), Postgres, CloudWatch, etc. Prometheus has a basic built-in graph view; Grafana is what teams actually put on the wall.
      - label: e.g.
        text: Prometheus scrapes /metrics from each pod every 15s and Grafana graphs p99 latency with alerts; commercial all-in-one APM (Application Performance Monitoring) tools like Instana (IBM) or Datadog instead bundle metrics, traces, and dashboards in one product.
    match:
      - - Prometheus
        - scrapes /metrics endpoints, stores the time-series, evaluates alert rules
      - - Grafana
        - queries those metrics and renders dashboards / panels (and can alert too)
      - - PromQL
        - the query language for slicing Prometheus metrics (rate, p99, by label)
      - - Exporter
        - exposes a /metrics endpoint (e.g. node-exporter) for Prometheus to scrape
    cloze:
      text: "{} scrapes a /metrics endpoint from each pod and stores the time-series data."
      answer: Prometheus
    hint: The scrape-and-store metrics engine plus its dashboard front-end.
    mcq:
      prompt: Your metrics are already scraped and stored. Which data-source-agnostic layer do teams put on the wall to graph them — alongside logs and traces from other backends — and alert on them?
      options:
      - Alertmanager
      - Grafana
      - PromQL
      - Prometheus
      answerIndex: 1
  - labels: [operations]
    topic: SLI / SLO / SLA
    desc: How you measure, target, and contractually promise reliability.
    extras:
      - label: e.g.
        text: SLI (Service Level Indicator) = % of requests under 300ms; SLO (Service Level Objective) = 99.9% of them monthly; SLA (Service Level Agreement) = the contract that refunds the customer if you miss it.
      - label: Error budget
        text: "the flip side of an SLO: 99.9% ⇒ 0.1% (~43 min/month) you're ALLOWED to fail. Budget left → ship features; budget spent → freeze releases and fix reliability."
      - label: Say
        text: “SLOs give an error budget that settles the feature-velocity vs. reliability fight with a number, not opinions.”
    match:
      - - SLI
        - the measurement (% of requests under 300ms)
      - - SLO
        - the internal target (99.9% monthly)
      - - SLA
        - the customer contract (refund if missed)
      - - Error budget
        - the 0.1% you're allowed to fail
    cloze:
      text: A 99.9% SLO implies an error {} of about 43 minutes of allowed failure per month.
      answer: budget
    hint: "Three acronyms in rising order of commitment: measure it, target it, promise it."
    mcq:
      prompt: The percentage of requests served under 300 ms is the raw measurement you compute from real traffic. Which term names that measurement — not the target you set on it, nor the contract you sign?
      options:
      - SLA
      - SLO
      - KPI
      - SLI
      answerIndex: 3
  - labels: [operations]
    topic: LLM/agent-specific observability
    desc: Tracing prompts, tokens, tool calls, and agent steps — the novel part of the product.
    extras:
      - label: e.g.
        text: LangSmith (LangChain's tracing/eval platform) or Langfuse (open-source LLM observability) capture each agent step as a nested trace — exact prompt, token counts + $ cost, which tool ran with what args, latency — so you can replay a failed run, see it looped between two tools, diff against a good run, and attach eval scores to catch regressions.
    cloze:
      text: Tools like LangSmith and {} capture each agent step — prompt, tokens, tool calls — as a nested trace.
      answer: Langfuse
    hint: Tracing the novel agent parts — prompts, tokens, tool calls, steps.
    mcq:
      prompt: LangChain's own hosted tracing-and-evaluation platform — capturing agent runs, token cost, and tool calls, and letting you attach eval scores to catch regressions — is called what?
      options:
      - Langfuse
      - LangSmith
      - MLflow
      - Weights & Biases
      answerIndex: 1

  - labels: [operations]
    topic: "A check that depends on nothing"
    desc: "The most reliable health signal doesn't trust any component to report its own success — it independently compares 'what IS running' to 'what SHOULD be'. Deploys drift silently, so a check that reads the live version (e.g. /api/versions) and diffs it against the latest release tag catches a failed deploy that every other signal reported as fine."
    cloze:
      text: "The most reliable health check trusts no component to report its own success — it independently compares what IS running to what {} be running, catching silent drift."
      answer: "should"
    extras:
      - label: Why
        text: "It catches a failed tagger, a failed deploy, a runner that never came back, and a job that timed out — WITHOUT trusting any of them to tell you. Drift = a failure nobody announced."
      - label: Principle
        text: "Prefer end-state verification over step-success. 'Every step returned 0' can still leave you running old code."

  - labels: [operations]
    topic: "Pull signals vs push alerts"
    desc: "A PULL signal waits for you to go look — a red ✗ in a CI list, a dashboard you have to open. A PUSH alert comes to you — a message to Slack/Discord, a page. Silent failure thrives on pull-only signals, so anything that must not be missed should PUSH."
    extras:
      - label: Balance
        text: "Push everything and you get alert fatigue (people mute it); push nothing and failures rot unnoticed. Push the few things that mean 'a human must act now'."
      - label: "e.g."
        text: "A deploy pipeline posts success/failure to the same webhook the boot scripts use, so a broken deploy finds you instead of waiting in a tab."
    match:
      - ["pull signal", "you go look — a red ✗, a dashboard"]
      - ["push alert", "it comes to you — Slack/Discord, a page"]
  - labels: [operations]
    topic: A health check that trusts no component
    desc: When a deploy silently reverts to old code even though every step reported success, the undetected gap between what is running and what should be running is called drift.
    cloze:
      text: When a deploy silently reverts to old code even though every step reported success, the undetected gap between what is running and what should be running is called {}.
      answer: drift
    mcq:
      prompt: A health check reads the LIVE running version and diffs it against the latest release tag, trusting no component to report its own success. Which principle does this follow?
      options:
      - Step-success checking
      - Synthetic monitoring
      - Heartbeat polling
      - End-state verification
      answerIndex: 3
  - labels: [operations]
    topic: Metric cardinality explosion
    desc: Putting a unique value like user_id or request_id into a Prometheus metric label multiplies the time-series count until the store falls over.
    cloze:
      text: Putting a unique value like user_id or request_id into a Prometheus metric {} multiplies the time-series count until the store falls over.
      answer: label
    mcq:
      prompt: Your metrics backend runs out of memory right after a deploy that added user_email as a tag on a request counter. Which problem did that tag cause?
      options:
      - Cardinality explosion
      - Sampling bias
      - Clock skew
      - Log truncation
      answerIndex: 0
  - labels: [operations]
    topic: RED vs USE method
    desc: For a request-driven service you watch Rate, Errors, and Duration — the RED method — rather than host utilization metrics.
    cloze:
      text: For a request-driven service you watch Rate, Errors, and Duration — the {} method — rather than host utilization metrics.
      answer: RED
    mcq:
      prompt: You are choosing the three signals to alert on for an HTTP API. Which method prescribes request rate, error rate, and latency, as opposed to the USE method's focus on resource utilization and saturation?
      options:
      - The RED method
      - The USE method
      - Golden ratios
      - Apdex scoring
      answerIndex: 0
  - labels: [operations]
    topic: Tail-based trace sampling
    desc: Recording a trace for every request is too costly at scale, so tracing systems keep only a fraction through sampling.
    cloze:
      text: Recording a trace for every request is too costly at scale, so tracing systems keep only a fraction through {}.
      answer: sampling
    mcq:
      prompt: At very high request rates you cannot store a span for every request, but you must keep every trace that contains an error. Which strategy decides AFTER a request finishes whether to keep its trace?
      options:
      - Tail-based sampling
      - Head-based sampling
      - Rate limiting
      - Downsampling
      answerIndex: 0
  - labels: [operations]
    topic: Alert on symptoms, not causes
    desc: Paging on every CPU blip trains responders to ignore the pager; mature on-call alerts on user-facing symptoms instead of internal causes.
    cloze:
      text: Paging on every CPU blip trains responders to ignore the pager; mature on-call alerts on user-facing {} instead of internal causes.
      answer: symptoms
    mcq:
      prompt: Your team gets two hundred pages a night, starts muting them, then misses a real outage. Which alerting principle most directly fixes this?
      options:
      - Alert on symptoms not causes
      - Add more alerts
      - Shorten every timeout
      - Page two people each time
      answerIndex: 0
  - labels: [operations]
    topic: Error budget policy
    desc: One minus the SLO is the error budget — the unreliability you are allowed to spend before feature work must stop and reliability work takes over.
    cloze:
      text: One minus the SLO is the error {} — the unreliability you are allowed to spend before feature work must stop and reliability work takes over.
      answer: budget
    mcq:
      prompt: A 99.9% target leaves about forty-three minutes of allowed downtime a month, and your team agrees to freeze features once it is used up. What is that allowance called?
      options:
      - The error budget
      - The SLA penalty
      - The toil quota
      - The blast radius
      answerIndex: 0
  - labels: [operations]
    topic: Blameless postmortem
    desc: After an incident, a blameless postmortem focuses on the systems and conditions that allowed the failure, not on punishing the engineer who triggered it.
    cloze:
      text: After an incident, a {} postmortem focuses on the systems and conditions that allowed the failure, not on punishing the engineer who triggered it.
      answer: blameless
    mcq:
      prompt: Your goal after an outage is honest disclosure and systemic fixes, so engineers report near-misses instead of hiding them. Which postmortem culture achieves that?
      options:
      - Blameless
      - Name-and-shame
      - Skip-if-minor
      - Manager-only
      answerIndex: 0
  - labels: [operations]
    topic: Toil reduction
    desc: Repetitive, manual, automatable operational work that scales with service size but adds no lasting value is called toil, and SRE's job is to automate it away.
    cloze:
      text: Repetitive, manual, automatable operational work that scales with service size but adds no lasting value is called {}, and SRE's job is to automate it away.
      answer: toil
    mcq:
      prompt: An SRE team caps time spent on manual, repetitive, ticket-driven ops at fifty percent so the rest goes to engineering. Which category of work is that cap meant to bound?
      options:
      - Toil
      - Incident response
      - Capacity planning
      - Code review
      answerIndex: 0
  - labels: [operations, fundamentals]
    topic: "Delta-of-delta timestamp encoding"
    desc: "Time-series samples arrive on a fixed interval, so instead of storing each 8-byte timestamp you
      store the gap from the previous one — and because those gaps are nearly always identical, you store
      the change in the gap, which is almost always ZERO. A zero costs a single bit. This is why a scrape
      every 15 seconds compresses to almost nothing on the timestamp side."
    extras:
      - label: e.g.
        text: "timestamps 10:00:00, 10:00:15, 10:00:30, 10:00:45 → deltas 15, 15, 15 → delta-of-deltas 0,
          0. Three timestamps that cost 24 bytes raw are now a handful of bits."
      - label: Say
        text: “It only degrades when the interval jitters. A scrape that lands at 15.001 seconds produces
          a non-zero delta-of-delta, so a small variable-length encoding covers the drift — you spend a few
          bits, not another 8 bytes.”
      - label: Trap
        text: it assumes REGULAR arrival. Irregular event data — logs, traces, user actions — has no fixed
          interval, so the delta-of-delta is never zero and this buys you very little. It is a time-series
          trick, not a general compression trick.
    cloze:
      text: Storing the change in the gap between successive timestamps, rather than the timestamps themselves,
        is called {} encoding.
      answer: delta-of-delta
      alts:
        - delta of delta
    hint: Regular intervals mean the gap between gaps is almost always the same number.
    mcq:
      prompt: A metrics store scrapes every 15 seconds and needs to store millions of timestamps cheaply.
        Which encoding exploits the fixed interval to reduce most timestamps to about one bit?
      options:
        - Delta-of-delta
        - Run-length encoding
        - Dictionary compression
        - Huffman coding
      answerIndex: 0
  - labels: [operations, fundamentals]
    topic: "XOR value encoding (Gorilla)"
    desc: "The other half of time-series compression. Consecutive readings of the same metric are usually
      similar — CPU 41.2% then 41.3% — and two similar IEEE-754 floats share most of their leading bits. XOR
      the new value against the previous one and the result is mostly zeros, which pack away to almost
      nothing. Together with delta-of-delta this takes 16 bytes per sample to under two, roughly a 10x
      reduction."
    table:
      - - ""
        - Naive
        - Gorilla-style
      - - Timestamp
        - 8 bytes
        - ~1 bit when regular
      - - Value
        - 8 bytes
        - a few bits when stable
      - - Per sample
        - 16 bytes
        - "~1.4 bytes"
      - - "333k samples/s"
        - 460 GB/day
        - "~45 GB/day"
    extras:
      - label: Say
        text: “The compression ratio is a property of the DATA, not the algorithm — it works because metrics
          are slow-moving. A metric that genuinely jumps around randomly compresses badly, and that is fine
          because real infrastructure metrics do not behave that way.”
      - label: e.g.
        text: named after Facebook's Gorilla paper (2015), and it is what Prometheus, InfluxDB and
          VictoriaMetrics all use in some form.
      - label: Trap
        text: this is the argument for a purpose-built time-series store over a relational one. A row store
          holding 460 GB a day of (timestamp, value) pairs is paying 10x for data whose shape it cannot
          exploit.
    cloze:
      text: Compressing a numeric sample by {}-ing it against the previous value, leaving mostly zero bits,
        is the value half of Gorilla encoding.
      answer: XOR
    hint: Two nearly-equal floats differ in only their trailing bits.
    mcq:
      prompt: A time-series database stores 333,000 samples per second. Naively that is 460 GB/day, but it
        actually writes about 45 GB/day. Which pair of techniques accounts for the roughly tenfold reduction?
      options:
        - Delta-of-delta timestamps plus XOR-encoded values
        - Gzip plus deduplication
        - Downsampling plus tiered storage
        - Column pruning plus dictionary encoding
      answerIndex: 0
  - labels: [operations]
    topic: "Downsampling & retention tiers"
    desc: "Compression shrinks each sample; downsampling throws samples away. Nobody queries 15-second
      resolution from eight months ago — they query a monthly trend — so keep raw data briefly, then roll it
      up. Storage drops by orders of magnitude and the query layer picks the resolution from the requested
      time range."
    items:
      - "Raw 15-second samples — retained ~15 days"
      - "5-minute rollups — retained ~90 days"
      - "1-hour rollups — retained ~2 years"
    extras:
      - label: Trap
        text: "roll up SKETCHES, not averages. Averaging pre-averaged data destroys your ability to compute
          percentiles over long windows, and the mean of per-window p99s is not the p99 — store mergeable
          histogram buckets or a t-digest instead."
      - label: Say
        text: “Keep min, max, sum and count per bucket rather than just the mean. Those four are mergeable,
          so a monthly view can be assembled from hourly rollups without ever touching raw data.”
      - label: e.g.
        text: dropping a whole time-bounded block is also why blocks are organised by time — expiring old
          data is deleting a file, never a row-by-row scan.
    cloze:
      text: Replacing old high-resolution samples with coarser aggregates to cut storage is called {}.
      answer: downsampling
      alts:
        - down-sampling
        - rollup
    hint: You keep the shape of old data without keeping every point.
    mcq:
      prompt: A team downsamples year-old metrics by storing only the average of each hour, and later finds
        it can no longer produce a meaningful p99 for that period. What should they have stored instead?
      options:
        - Mergeable histogram buckets or a sketch
        - The maximum of each hour
        - A larger sample of raw points
        - The median of each hour
      answerIndex: 0
