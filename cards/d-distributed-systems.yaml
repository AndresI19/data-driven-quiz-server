section:
  key: D
  name: Distributed Systems
  color: "#f59e0b"
cards:
  - topic: Event-driven architecture
    desc: Components communicating via asynchronous events/messages instead of direct synchronous calls.
    extras:
      - label: e.g.
        text: Uber emits a TripCompleted event to Kafka; payments, receipts, driver-payout, and fraud-scoring each consume it at their own pace — and you can add an analytics consumer later without touching the producer.
    cloze:
      text: In {}-driven architecture, services communicate via asynchronous messages instead of direct calls.
      answer: event
    hint: Services talk via asynchronous messages instead of direct calls.
    mcq:
      prompt: Uber publishes a TripCompleted message to Kafka; payments, receipts, and fraud-scoring each consume it at their own pace, and a new analytics consumer can be added later without changing the producer. Which architectural style is this?
      options:
      - Request-response
      - Event-driven
      - Layered monolith
      - Client-server
      answerIndex: 1
  - topic: Message queues & streams
    desc: Async messaging between services. A queue delivers a message to one worker then deletes it; a log/stream is append-only and retained, so many consumers can replay it independently.
    extras:
      - label: e.g.
        text: "RabbitMQ (smart broker: routing, priorities, per-message acks) and SQS (managed, simple) are task queues; Kafka is a durable log that analytics and billing can each replay from."
      - label: Say
        text: “Use a queue to hand out work; use a log when multiple consumers must replay the same events.”
      - label: Delivery
        text: at-most-once (fire-and-forget, may LOSE) · at-least-once (retries, may DUPLICATE — the common default) · exactly-once (hard + costly). The practical combo is at-least-once + an IDEMPOTENT consumer so duplicates are harmless.
      - label: Trap
        text: Kafka isn't 'just a queue' — messages aren't deleted on read; each consumer tracks its own offset.
    mc:
      - Pub/sub vs point-to-point
      - Batch vs stream processing
      - Sync RPC vs async messaging
    cloze:
      text: A durable log like {} keeps messages after they're read, so each consumer tracks its own offset.
      answer: Kafka
    hint: A queue hands work to one worker; a log lets many consumers replay.
    mcq:
      prompt: Which system is a durable, append-only commit log where every consumer tracks its own offset — rather than a broker that deletes each message once one worker has handled it?
      options:
      - RabbitMQ
      - SQS
      - Redis
      - Kafka
      answerIndex: 3
  - topic: Consensus & coordination
    desc: How independent servers agree on a single value, leader, or ordered log despite failures and network delays. Consensus algorithms (Raft, Paxos) require a MAJORITY (quorum) of members to commit each decision — so the cluster stays correct and avoids split-brain (two leaders acting at once) as long as more than half the members are reachable.
    extras:
      - label: e.g.
        text: etcd (Kubernetes's backing store) uses Raft to replicate state across its members; a 3-member etcd cluster tolerates 1 failure, a 5-member tolerates 2 (quorum = ⌊N/2⌋+1).
      - label: Used for
        text: leader election, distributed locks, replicated config/state, and cluster membership — the job of coordination services like etcd, ZooKeeper, and Consul.
      - label: How Raft
        text: one LEADER is elected for a TERM (a numbered epoch); all writes go to the leader, which appends them to its log and replicates to followers. A write COMMITS once a majority has stored it. If the leader dies, followers time out and elect a new one for a higher term — the term number is how the cluster rejects a stale leader coming back (that's how split-brain is avoided).
      - label: Paxos vs Raft
        text: same guarantee (agreement despite failures); Raft was designed to be UNDERSTANDABLE — explicit leader + terms + log — whereas Paxos is famously hard to reason about. New systems almost always pick Raft.
      - label: Trap
        text: "run an ODD number of members: 3 and 4 members BOTH tolerate only 1 failure, so a 4th adds cost without more resilience. Use 3 or 5."
    cloze:
      text: Consensus algorithms like Raft require a {} of members to commit each decision.
      answer: majority
      alts:
        - quorum
    hint: How independent servers agree despite failures — and how many must agree.
    mcq:
      prompt: A coordination system elects a single leader per numbered term and replicates an append-only log to its followers, and was designed to be easier to understand than its predecessor. Which consensus algorithm is it?
      options:
      - Paxos
      - Raft
      - Gossip
      - ZAB
      answerIndex: 1
  - topic: etcd
    desc: A distributed, strongly-consistent key-value store — Kubernetes's single source of truth. EVERY cluster object (pods, services, secrets, configmaps) is persisted in etcd, and the API server is the only component that talks to it. It uses the Raft consensus algorithm to replicate data across its members, so a quorum must agree on every write.
    extras:
      - label: e.g.
        text: kubectl get reads from etcd via the API server; kubectl apply writes to etcd, which Raft-replicates to the other members before acking.
      - label: Key traits
        text: key-value store + a WATCH API (clients subscribe to changes — how K8s controllers react to state), versioned/MVCC history, linearizable reads, TLS-secured. Run 3 or 5 members for HA.
      - label: Trap
        text: etcd is the crown jewel — lose quorum and the control plane goes READ-ONLY; lose etcd with no backup and the cluster's entire state is gone. Snapshot it (etcdctl snapshot save).
    cloze:
      text: Kubernetes persists all cluster state in {}, a strongly-consistent key-value store.
      answer: etcd
    hint: Kubernetes' single source of truth — what kind of store, kept consistent how?
    mcq:
      prompt: Lose quorum on this component and the Kubernetes control plane goes read-only; lose it with no snapshot and the entire cluster's state is gone. Which component?
      options:
      - kube-apiserver
      - kube-scheduler
      - kubelet
      - etcd
      answerIndex: 3
  - topic: Eventual consistency & sagas
    desc: Handling multi-step operations across services without a single distributed transaction.
    extras:
      - label: e.g.
        text: "a booking saga: reserve flight → charge card → book hotel; if the hotel step fails, run compensating actions to undo the charge and reservation."
    diagram: saga
    match:
      - - Saga
        - a multi-step op split across services
      - - Compensating action
        - undoes a prior step when a later one fails
      - - Eventual consistency
        - replicas converge over time, not instantly
    cloze:
      text: When one step of a distributed saga fails, you run {} actions to undo the earlier steps.
      answer: compensating
      alts:
        - compensation
    order:
      - "Reserve the flight"
      - "Charge the card"
      - "Book the hotel"
      - "If a later step fails, run compensating actions to undo the earlier ones"
    hint: Multi-step ops without one big transaction — how do you undo a failed step?
    mcq:
      prompt: In a booking flow (reserve flight, charge card, book hotel), the hotel step fails. What undoes the already-charged card and the flight reservation, given you cannot roll back across services?
      options:
      - Two-phase commit
      - Compensating action
      - Retry with backoff
      - Optimistic lock
      answerIndex: 1
  - topic: Retries, timeouts, circuit breakers
    desc: The resilience patterns that stop one slow dependency from cascading into a full outage.
    extras:
      - label: e.g.
        text: "calls to a flaky payment API: 3 retries with exponential backoff + jitter, a 2s timeout, and a circuit breaker that trips after 50% errors so you fail fast instead of piling up."
    cloze:
      text: A {} breaker trips after too many failures so calls fail fast instead of piling up.
      answer: circuit
    hint: The patterns that stop one slow dependency from cascading into an outage.
    mcq:
      prompt: Calls to a flaky payment API pile up because each one waits the full connection time before giving up. Which resilience control caps how long you will wait on a single call?
      options:
      - Circuit breaker
      - Retry
      - Backoff jitter
      - Timeout
      answerIndex: 3

  - topic: "Single-replica assumptions that break when you scale out"
    desc: "State kept IN-PROCESS (a rate-limiter counter, a cache, a session) works on one replica and silently breaks on several: each replica has its own copy. An in-memory rate limit of 10/min across 3 replicas becomes an effective 30/min; an in-process cache gives inconsistent reads."
    cloze:
      text: "State kept {} — a counter, cache, or session — works on one replica but silently breaks across several, since each replica has its own copy."
      answer: "in-process"
      alts:
        - "in process"
        - "in-memory"
        - "in memory"
    extras:
      - label: Fix
        text: "Move shared state to a shared store (Redis, the database). If you must stay single-replica, make that assumption EXPLICIT — because it fails quietly, not loudly, when someone scales the deployment."
      - label: Say
        text: "\"Anything counted or cached in process is per-replica; horizontal scaling multiplies it unless the state is shared.\""
    mcq:
      prompt: An in-memory rate limiter set to 10 requests per minute runs on 3 replicas behind a round-robin load balancer, each keeping its own counter. What is the effective global limit?
      options:
      - 10 / min
      - 30 / min
      - 3 / min
      - 3.3 / min
      answerIndex: 1

  - topic: "Idempotency and delivery semantics"
    desc: "An IDEMPOTENT operation can be applied many times with the same result as once. It's what makes retries safe in a distributed system, where you usually get AT-LEAST-once delivery (messages can arrive twice) rather than exactly-once. Idempotency keys or version checks turn 'at-least-once + idempotent' into effectively exactly-once."
    extras:
      - label: "e.g."
        text: "'Charge card, idempotency key abc123' — the payment processor dedupes on the key, so a retried request doesn't double-charge."
      - label: Trap
        text: "True exactly-once delivery is nearly impossible; the practical answer is at-least-once delivery made safe by idempotent handlers."
    cloze:
      text: "Retries are safe when the operation is {} — applying it twice is the same as applying it once."
      answer: "idempotent"
    mcq:
      prompt: Your broker retries on failure, so a consumer sometimes sees the same message twice but never loses one. Which delivery guarantee is this?
      options:
      - At-most-once
      - Exactly-once
      - Best-effort
      - At-least-once
      answerIndex: 3

  - topic: "Outbound-only architecture (caller vs callee)"
    desc: "A security posture where NOTHING on the internet can open a connection INTO your machine — every connection is dialled OUT from your side. A tunnel client (e.g. cloudflared) dials out to the edge; a CI runner long-POLLS its queue; the node PULLS images. With no inbound port, there's no listening surface to attack."
    cloze:
      text: "In an outbound-only posture, nothing on the internet can open a connection into your machine — every connection is dialled {}, so there is no listening surface to attack."
      answer: "out"
      alts:
        - "outbound"
        - "outward"
    extras:
      - label: Caller vs callee
        text: "In a diagram, draw the arrow from who OPENS the connection to who receives it — not the direction the bytes travel. The runner points at GitHub even though jobs 'come to' it, because the runner dialled out."
      - label: Why
        text: "You can run public-facing services on a machine with zero open ports, because reachability comes from outbound tunnels, not inbound firewall holes."
    mcq:
      prompt: How can you expose public-facing services from a machine that has zero open inbound ports and lets nothing on the internet dial in?
      options:
      - A static public IP
      - Outbound tunnels
      - Port forwarding
      - A firewall exception
      answerIndex: 1
  - topic: Two-phase commit blocking
    desc: Two-phase commit gives cross-service atomicity but blocks every participant if the coordinator crashes after the prepare phase, which is why sagas are preferred at scale.
    cloze:
      text: Two-phase commit gives cross-service atomicity but blocks every participant if the {} crashes after the prepare phase, which is why sagas are preferred at scale.
      answer: coordinator
    mcq:
      prompt: A cross-service transaction leaves rows locked for minutes when one node dies mid-commit, because all participants wait on a single decision-maker. Which protocol has this blocking failure mode?
      options:
      - Two-phase commit
      - Gossip protocol
      - Vector clocks
      - Leader election
      answerIndex: 0
  - topic: Idempotent consumer for effective exactly-once
    desc: True exactly-once delivery is impossible over an unreliable network, so systems approximate it by pairing at-least-once delivery with an idempotent consumer.
    cloze:
      text: True exactly-once delivery is impossible over an unreliable network, so systems approximate it by pairing at-least-once delivery with an idempotent {}.
      answer: consumer
    mcq:
      prompt: Your payment worker sometimes receives the same message twice and can never lose one. Rather than chase exactly-once delivery, which design makes double-processing harmless?
      options:
      - A dedup key on writes
      - A larger consumer group
      - A shorter retention window
      - Synchronous acknowledgements
      answerIndex: 0
  - topic: Logical clocks vs wall-clock ordering
    desc: Ordering events across machines by wall-clock time is unsafe because clocks drift; distributed systems order causally-related events with logical clocks instead.
    cloze:
      text: Ordering events across machines by wall-clock time is unsafe because clocks drift; distributed systems order causally-related events with {} clocks instead.
      answer: logical
    mcq:
      prompt: Two datacenters disagree on which of two writes came first, because their NTP-synced clocks still differ by milliseconds. Which mechanism captures 'happened-before' without trusting wall time?
      options:
      - Vector clocks
      - Unix timestamps
      - GPS receivers
      - Sequence gaps
      answerIndex: 0
  - topic: Kafka consumer-group parallelism
    desc: In Kafka, the unit of consumer parallelism is the partition, so adding more consumers than partitions in a group leaves the extras idle.
    cloze:
      text: In Kafka, the unit of consumer parallelism is the partition, so adding more consumers than {} in a group leaves the extras idle.
      answer: partitions
    mcq:
      prompt: Your consumer group has twelve members but only eight partitions, and four consumers do nothing. Which fact explains why the extra consumers cannot help?
      options:
      - One partition per consumer max
      - Brokers cap consumers
      - Offsets are shared
      - Topics limit threads
      answerIndex: 0
  - topic: Partition key and ordering
    desc: Kafka guarantees order only within a single partition, so events that must stay ordered — one account's transactions — must share a partition key.
    cloze:
      text: Kafka guarantees order only within a single partition, so events that must stay ordered — one account's transactions — must share a partition {}.
      answer: key
    mcq:
      prompt: Two updates for the same user were processed out of order because they landed on different partitions. Which choice guarantees a given user's events keep their produced order?
      options:
      - Key by user id
      - Add more partitions
      - Increase replication
      - Shorten retention
      answerIndex: 0
