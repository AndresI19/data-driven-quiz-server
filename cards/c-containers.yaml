section:
  key: C
  name: Containers
  color: "#14b8a6"
cards:
  - topic: Containers vs. VMs
    desc: Process-level isolation sharing the host kernel vs. a full guest OS — and the weight/speed tradeoff.
    cloze:
      text: Containers share the host {}, whereas each VM ships a full guest OS.
      answer: kernel
    hint: Shared kernel versus a full guest OS — the weight/speed tradeoff.
    mcq:
      prompt: Why does a container start in milliseconds while a VM takes far longer to boot?
      options:
      - it reuses the host's running kernel
      - it boots a smaller guest OS
      - it skips the hypervisor's scheduler
      - it caches a guest kernel image
      answerIndex: 0
  - topic: "OS layers: node → pod → container"
    desc: "The nesting on ONE shared kernel: a node has a single Linux kernel; a pod groups containers that share a network namespace (1 IP); a container is an isolated process with its own filesystem. Containers ship userspace, not a kernel."
    diagram: nested_layers
    match:
      - - node
        - one shared Linux kernel
      - - pod
        - one network namespace / 1 IP
      - - container
        - own filesystem, isolated process
    cloze:
      text: A {} groups containers that share one network namespace and a single IP.
      answer: pod
    hint: Three nested levels on one kernel — what each one owns.
    mcq:
      prompt: Two containers must reach each other over localhost and share one IP. Which Kubernetes construct do you put them in?
      options:
      - the same pod
      - the same node
      - the same namespace
      - the same Deployment
      answerIndex: 0
  - topic: What's shared vs. isolated across the folds
    desc: "Who shares what as you nest node → pod → container:"
    extras:
      - label: namespace
        text: a kernel NAMESPACE isolates what a process can SEE — net ns = its own network stack + IP, PID ns = its own process tree, mount ns = its own filesystem view. The 'what you can see' knob. Containers sharing a pod share the net + IPC namespaces.
      - label: cgroup
        text: a control group is the kernel feature that LIMITS and meters a process's CPU / memory / I/O. The 'how much you can use' knob — a container's memory limit (and the OOMKill when it's exceeded) is enforced here.
      - label: IPC
        text: Inter-Process Communication namespace — POSIX shared memory + semaphores. Shared within a pod, so co-located containers can talk over shared memory; separate pods cannot.
      - label: Say
        text: “Namespaces isolate what you SEE; cgroups limit what you USE. A container is just a process wearing both.”
    table:
      - - Boundary
        - Shares
        - Isolates (own)
      - - Node → all
        - kernel, CPU, RAM
        - —
      - - Pod
        - net ns (1 IP), IPC, hostname
        - —
      - - Container
        - the pod's net / IPC
        - filesystem, PID, cgroup
    match:
      - - Node → all
        - share kernel, CPU, RAM
      - - Pod
        - shares net ns (1 IP), IPC, hostname
      - - Container
        - isolates filesystem, PID, cgroup
    hint: As you nest node→pod→container, who shares what and who isolates what?
  - topic: Worker-node scaling (pods vs. nodes)
    desc: "Two independent loops: the HPA adds/removes PODS on existing nodes; the Cluster Autoscaler (or Karpenter) adds/removes NODES — actual cloud VMs — when pods can't be scheduled or nodes sit idle."
    extras:
      - label: e.g.
        text: a spike makes the HPA want 20 pods, but nodes are full so new pods sit Pending → the Cluster Autoscaler provisions 2 more EC2 nodes → pods schedule; when load drops it drains and terminates the extra nodes.
      - label: How
        text: "node scaling reaches the HARDWARE layer: each node is a VM/instance, so adding a node = the cloud booting another machine with its own kernel (minutes), while adding a pod just folds another process onto an existing kernel (ms)."
    match:
      - - HPA
        - adds/removes PODS on existing nodes
      - - Cluster Autoscaler
        - adds/removes NODES (cloud VMs)
      - - Karpenter
        - faster just-in-time node provisioning
    cloze:
      text: The {} (or Karpenter) adds and removes nodes, while the HPA adds and removes pods.
      answer: Cluster Autoscaler
      alts:
        - cluster autoscaler
        - autoscaler
    hint: Two independent loops — one scales pods, one scales nodes.
    mcq:
      prompt: A spike makes the HPA request 20 pods, but they sit Pending because nodes are full. What provisions MORE nodes so they can schedule?
      options:
      - Cluster Autoscaler
      - Vertical Pod Autoscaler
      - kube-proxy
      - kube-scheduler
      answerIndex: 0
  - topic: Docker commands (basic → advanced)
    desc: Docker builds images (blueprints) and runs them as containers (running instances). Commands roughly basic → advanced.
    extras:
      - label: Trap
        text: "docker run makes a NEW container every time — restart an existing one with docker start (running again gives 'name already in use'). The writable layer is ephemeral: no volume = data gone on rm."
    items:
      - build -t name:tag . — build an image from the Dockerfile in .
      - run -d -p 8080:80 --name web img — run a container (detached, host:container port map)
      - ps [-a] · logs -f <ctr> — list running/all containers / stream logs
      - exec -it <ctr> sh — shell into a running container
      - images · pull|push <img> — list / move images to a registry
      - stop|start|rm <ctr> · rmi <img> — lifecycle / cleanup
      - build --target <stage> — multi-stage build for a small final image
      - inspect <obj> · stats — full JSON metadata / live CPU-mem usage
      - volume create · run -v data:/path — persist data outside the container layer
      - network create · run --network <net> — user-defined net for name-based DNS
      - compose up -d | down — run/stop a multi-container stack from compose.yaml
      - system prune -a · build --no-cache — reclaim space / bust the layer cache
    hint: Build, run, inspect — then volumes, networks, compose.
    mcq:
      prompt: You have a STOPPED container and want it running again WITHOUT creating a new one. Which command?
      options:
      - docker start
      - docker run
      - docker create
      - docker exec
      answerIndex: 0
  - topic: Namespaces vs cgroups (see vs use)
    desc: A kernel namespace isolates what a process can SEE — its own network stack, PID tree, or filesystem view.
    cloze:
      text: A kernel {} isolates what a process can SEE — its own network stack, PID tree, or filesystem view.
      answer: namespace
    mcq:
      prompt: A container's MEMORY limit — and the OOMKill when it's exceeded — is enforced by which kernel feature?
      options:
      - cgroups
      - namespaces
      - capabilities
      - seccomp
      answerIndex: 0
  - topic: Multi-stage builds
    desc: Shipping compilers and build tools inside the final runtime image bloats it and widens attack surface; the fix is a multi-stage build that copies only artifacts into a slim final stage.
    cloze:
      text: Shipping compilers and build tools inside the final runtime image bloats it and widens attack surface; the fix is a {} build that copies only artifacts into a slim final stage.
      answer: multi-stage
    mcq:
      prompt: Your production image is over a gigabyte because it still contains the JDK and Maven used to compile. Which Dockerfile technique yields a tiny final image holding only the built jar and a JRE?
      options:
      - Multi-stage builds
      - Layer caching
      - Base-image pinning
      - Build arguments
      answerIndex: 0
  - topic: Running as non-root
    desc: By default a container process runs as UID 0, so a breakout inherits host root; the hardening step sets a non-root runAsUser in the securityContext.
    cloze:
      text: By default a container process runs as UID 0, so a breakout inherits host root; the hardening step sets a non-root {} in the securityContext.
      answer: runAsUser
    mcq:
      prompt: A CVE lets an attacker escape a container onto the node, and the blast radius is worst because the process ran as UID 0. Which single change most reduces that blast radius?
      options:
      - Run as a non-root user
      - Add a readiness probe
      - Pin the image tag
      - Enable a liveness probe
      answerIndex: 0
  - topic: Layer-cache ordering
    desc: Placing `COPY . .` before the dependency install in a Dockerfile busts the install layer on every source edit; the fix is to copy the lockfile first.
    cloze:
      text: Placing `COPY . .` before the dependency install in a Dockerfile busts the install layer on every source edit; the fix is to copy the {} first.
      answer: lockfile
    mcq:
      prompt: Every one-line code change triggers a full dependency reinstall in CI, because the install step sits after the step that copies all source. Which reordering restores cache hits?
      options:
      - Copy manifests before source
      - Copy source before manifests
      - Merge both COPY steps
      - Move install to the top
      answerIndex: 0
  - topic: PID 1 signal handling
    desc: A shell-form CMD makes your app a child of /bin/sh, which swallows SIGTERM, so Kubernetes must SIGKILL it after the grace period; run it as PID 1 with exec-form instead.
    cloze:
      text: A shell-form CMD makes your app a child of /bin/sh, which swallows SIGTERM, so Kubernetes must SIGKILL it after the grace period; run it as PID {} with exec-form instead.
      answer: '1'
    mcq:
      prompt: Your pods always take the full termination grace period and are then force-killed, because SIGTERM reaches the shell wrapping your process, not the process. Which Dockerfile change delivers the signal to the app directly?
      options:
      - Use exec-form CMD
      - Set STOPSIGNAL SIGKILL
      - Raise terminationGracePeriod
      - Add a postStart hook
      answerIndex: 0
